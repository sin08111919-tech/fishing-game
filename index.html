<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>별빛 낚시마을</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#102d43;color:white;font-family:system-ui,sans-serif;overflow:hidden}

#game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#79d5ee 0%,#c0f0ed 34%,#48c9c5 35%,#168ca9 100%)}

.sun{position:absolute;top:7%;right:12%;width:70px;height:70px;border-radius:50%;background:#fff1ad;box-shadow:0 0 45px #fff5b8}

.cloud{position:absolute;font-size:45px;opacity:.85;animation:drift 22s linear infinite}

.c1{top:9%;left:8%}.c2{top:20%;right:28%;animation-delay:-9s}

@keyframes drift{from{transform:translateX(-15px)}to{transform:translateX(35px)}}

.mountain{position:absolute;top:25%;width:100%;height:16%;background:#75b8a4;clip-path:polygon(0 80%,17% 10%,33% 75%,53% 0,75% 80%,91% 24%,100% 60%,100% 100%,0 100%)}

.farbank{position:absolute;top:33%;height:12%;width:100%;background:#4b9b75;clip-path:polygon(0 45%,12% 15%,25% 40%,42% 5%,60% 35%,77% 10%,100% 40%,100% 100%,0 100%)}

.water{position:absolute;top:39%;bottom:0;width:100%;background:linear-gradient(180deg,#48c7c5,#1689ad 65%,#07516f)}

.water:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(175deg,transparent 0 24px,#a2f6ed44 25px 27px,transparent 28px 54px);animation:ripple 7s linear infinite}

@keyframes ripple{from{background-position:0 0}to{background-position:180px 0}}

.land{position:absolute;top:35%;left:-8%;width:65%;height:24%;background:#71bd78;border-radius:0 50% 35% 0;transform:rotate(-5deg);box-shadow:inset -8px -12px #438f68}

.land2{position:absolute;top:37%;right:-14%;width:50%;height:19%;background:#8acb80;border-radius:50% 0 0 45%;transform:rotate(5deg)}

.tree{position:absolute;z-index:2;font-size:clamp(35px,9vw,65px);filter:drop-shadow(0 5px 2px #285c4a55)}

.t1{top:26%;left:2%}.t2{top:30%;left:30%}.t3{top:27%;right:5%}.t4{top:32%;right:22%}

.cabin{position:absolute;z-index:3;top:23%;left:48%;width:140px;height:115px;transform:translateX(-50%)}

.roof{position:absolute;top:0;left:-9px;width:158px;height:62px;background:#8d5145;clip-path:polygon(50% 0,100% 65%,91% 78%,50% 25%,9% 78%,0 65%);filter:drop-shadow(0 4px 2px #75453c)}

.house{position:absolute;top:37px;left:12px;width:116px;height:72px;background:#f4d4a0;border:5px solid #9a6344;border-top:0}

.door{position:absolute;bottom:0;left:43px;width:28px;height:48px;background:#88543d;border:3px solid #6b4032;border-radius:5px 5px 0 0}

.window{position:absolute;top:12px;width:25px;height:25px;background:#b8f5f4;border:4px solid #a26948}

.w1{left:8px}.w2{right:8px}

.smoke{position:absolute;top:-17px;right:20px;font-size:23px;animation:drift 3s infinite alternate}

.dock{position:absolute;z-index:4;top:48%;left:39%;width:120px;height:18px;background:repeating-linear-gradient(90deg,#a9754c 0 24px,#71452e 25px 28px);transform:rotate(8deg);border:2px solid #75472f;box-shadow:0 5px 0 #104f68}

.rod{position:absolute;top:-48px;left:80px;width:3px;height:58px;background:#503b2c;transform:rotate(-25deg);transform-origin:bottom}

.line{position:absolute;top:2px;left:97px;height:48px;width:1px;background:#f6fff4}

.float{position:absolute;top:45px;left:93px;font-size:17px;animation:bob 1.8s infinite}

@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(5px)}}

.hud{position:absolute;z-index:10;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}

.pill{background:#153b4ddd;border:1px solid #b7f6e577;padding:9px 12px;border-radius:18px;box-shadow:0 4px 10px #153c4c33;font-size:13px;font-weight:800}

.title{position:absolute;z-index:5;top:4%;left:50%;transform:translateX(-50%);font-size:clamp(21px,6vw,30px);font-weight:1000;color:#fff;text-shadow:0 3px 0 #347f90,0 5px 10px #235c6c;text-align:center;white-space:nowrap}

.subtitle{font-size:10px;letter-spacing:3px;color:#e6fff8}

.controls{position:absolute;z-index:10;bottom:18px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{border:0;border-radius:17px;padding:15px 8px;font-size:15px;font-weight:900;color:#174252;background:linear-gradient(#fff4c7,#ffcf79);box-shadow:0 5px 0 #bd824c;cursor:pointer}

button:active{transform:translateY(4px);box-shadow:0 1px 0 #bd824c}

button.secondary{background:linear-gradient(#e6ffff,#90e5e1);box-shadow:0 5px 0 #439d9e}

#message{position:absolute;z-index:8;bottom:105px;left:50%;transform:translateX(-50%);background:#123d50dd;border:1px solid #c0fff2;border-radius:20px;padding:10px 15px;font-size:13px;font-weight:800;white-space:nowrap;max-width:94%;text-align:center}

.panel{display:none;position:absolute;z-index:20;inset:12% 5% 12%;overflow:auto;background:#143e51f5;border:2px solid #9dece2;border-radius:25px;padding:18px;box-shadow:0 12px 40px #06344b88}

.panel h2{text-align:center;margin:4px 0 15px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.fish{background:#ffffff12;border:1px solid #ffffff20;border-radius:15px;padding:12px;text-align:center}

.fish .emoji{font-size:35px}.fish b{display:block;font-size:14px}.fish small{color:#b9e9e9}

.close{width:100%;margin-top:15px;background:#c0f2e8}

.sparkle{position:absolute;z-index:2;pointer-events:none;animation:twinkle 2s infinite alternate}

@keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}

#toast{position:absolute;z-index:30;top:19%;left:50%;transform:translateX(-50%);font-size:25px;font-weight:1000;text-align:center;text-shadow:0 3px 5px #17485b;pointer-events:none}

</style>

</head>

<body>

<div id="game">

  <div class="sun"></div>

  <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>

  <div class="mountain"></div><div class="farbank"></div>

  <div class="water"></div>

  <div class="land"></div><div class="land2"></div>

  <div class="tree t1">🌳</div><div class="tree t2">🌲</div>

  <div class="tree t3">🌳</div><div class="tree t4">🌲</div>

  <div class="cabin">

    <div class="roof"></div>

    <div class="house"><div class="window w1"></div><div class="window w2"></div><div class="door"></div></div>

    <div class="smoke">☁️</div>

  </div>

  <div class="dock"><div class="rod"></div><div class="line"></div><div class="float">🔴</div></div>

  <div class="title">✨ 별빛 낚시마을 ✨<div class="subtitle">STARLIGHT FISHING</div></div>

  <div class="hud">

    <div class="pill">🪙 <span id="coins">0</span></div>

    <div class="pill">🐟 <span id="count">0</span>마리</div>

    <div class="pill">🎣 LV.<span id="level">1</span></div>

  </div>

  <div id="message">🌊 잔잔한 호수에서 낚시를 시작해 봐!</div>

  <div id="toast"></div>

  <div class="controls">

    <button id="cast">🎣 낚싯대 던지기</button>

    <button class="secondary" id="bag">🐠 물고기 도감</button>

    <button class="secondary" id="home">🏡 우리 집</button>

    <button id="upgrade">✨ 집 꾸미기 · 100🪙</button>

  </div>

  <div class="panel" id="collection">

    <h2>🐠 신비한 물고기 도감</h2>

    <div class="grid" id="fishgrid"></div>

    <button class="close" onclick="closePanel()">돌아가기</button>

  </div>

  <div class="panel" id="housepanel">

    <h2>🏡 나의 호숫가 별장</h2>

    <div style="text-align:center;font-size:65px">🏡</div>

    <p style="text-align:center">낚시로 모은 코인으로 집을 꾸며 봐!</p>

    <div id="houseinfo" style="text-align:center;line-height:2"></div>

    <button class="close" onclick="closePanel()">돌아가기</button>

  </div>

</div>

<script>

const species=[

 {name:"은빛 송어",emoji:"🐟",rarity:"일반",value:5,chance:25},

 {name:"황금 잉어",emoji:"🐠",rarity:"희귀",value:18,chance:17},

 {name:"달빛 해파리",emoji:"🪼",rarity:"희귀",value:30,chance:13},

 {name:"바다 천사",emoji:"🪽",rarity:"희귀",value:35,chance:11},

 {name:"유령 물고기",emoji:"👻",rarity:"초희귀",value:60,chance:9},

 {name:"아기 아홀로틀",emoji:"🦎",rarity:"초희귀",value:75,chance:8},

 {name:"보석 비늘어",emoji:"💎",rarity:"초희귀",value:100,chance:6},

 {name:"심해 랜턴어",emoji:"🏮",rarity:"전설",value:160,chance:4},

 {name:"수정 드래곤어",emoji:"🐉",rarity:"전설",value:250,chance:3},

 {name:"우주 고래",emoji:"🐋",rarity:"신화",value:500,chance:2},

 {name:"별의 왕 물고기",emoji:"🌟",rarity:"신화",value:1000,chance:1},

 {name:"고대 화석어",emoji:"🦴",rarity:"전설",value:220,chance:1}

];

let coins=0,count=0,level=1,houseLevel=0,owned={},busy=false;

const $=id=>document.getElementById(id);

function update(){

 $("coins").textContent=coins;$("count").textContent=count;$("level").textContent=level;

 $("upgrade").textContent="✨ 집 꾸미기 · "+(100+houseLevel*150)+"🪙";

 $("houseinfo").innerHTML="별장 레벨: "+(houseLevel+1)+"<br>보유 코인: "+coins+"🪙<br>꾸미기 단계: "+houseLevel;

}

function say(t){$("message").textContent=t}

function showToast(t){$("toast").textContent=t;setTimeout(()=>$("toast").textContent="",1800)}

function closePanel(){$("collection").style.display="none";$("housepanel").style.display="none"}

function openPanel(id){closePanel();$(id).style.display="block"}

function fishRoll(){

 let total=species.reduce((s,f)=>s+f.chance,0),n=Math.random()*total;

 for(const f of species){n-=f.chance;if(n<0)return f}

 return species[0];

}

$("cast").onclick=()=>{

 if(busy)return;

 busy=true;$("cast").textContent="🌊 낚시 중...";

 say("✨ 찌가 흔들리는지 기다려 봐...");

 setTimeout(()=>{

   const f=fishRoll();coins+=f.value;count++;owned[f.name]=(owned[f.name]||0)+1;

   if(count%5===0)level++;

   showToast(f.emoji+" "+f.name+"!");

   say(f.rarity+" 물고기 "+f.name+"을(를) 잡았어! +"+f.value+"🪙");

   update();$("cast").textContent="🎣 낚싯대 던지기";busy=false;

 },1000+Math.random()*1200);

};

$("bag").onclick=()=>{

 $("fishgrid").innerHTML=species.map(f=>'<div class="fish"><div class="emoji">'+(owned[f.name]?f.emoji:"❔")+'</div><b>'+(owned[f.name]?f.name:"미발견 물고기")+'</b><small>'+f.rarity+' · '+(owned[f.name]?(owned[f.name]+"마리"):"미발견")+'</small></div>').join("");

 openPanel("collection");

};

$("home").onclick=()=>{update();openPanel("housepanel")};

$("upgrade").onclick=()=>{

 const cost=100+houseLevel*150;

 if(coins<cost){say("🪙 코인이 부족해! 물고기를 더 잡아 보자.");return}

 coins-=cost;houseLevel++;

 const cabin=document.querySelector(".cabin");

 cabin.style.transform="translateX(-50%) scale("+(1+Math.min(houseLevel,5)*.07)+")";

 cabin.querySelector(".roof").style.background=["#8d5145","#a85b83","#526fbd","#b88b37","#6e65a8","#388b7b"][Math.min(houseLevel,5)];

 document.querySelector(".sun").style.boxShadow="0 0 "+(45+houseLevel*10)+"px #fff5b8";

 showToast("🏡 우리 집이 더 멋져졌어!");

 say("✨ 별장 꾸미기 완료! 다음 단계도 도전해 봐.");

 update();

};

for(let i=0;i<12;i++){

 const s=document.createElement("div");s.className="sparkle";

 s.textContent="✦";s.style.left=Math.random()*95+"%";s.style.top=(42+Math.random()*42)+"%";

 s.style.color=["#eaffff","#fff4ae","#c5ffff"][i%3];s.style.fontSize=(10+Math.random()*12)+"px";

 s.style.animationDelay=Math.random()*2+"s";$("game").appendChild(s);update();

</script>

</body>

</html>
