<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포근한 낚시생활 RPG</title>
<style>
:root{--ink:#263b46;--cream:#fff8e8;--green:#8ccf9b;--dark:#245c55;--gold:#ffd36e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9e6e0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.pill{background:rgba(255,250,235,.94);border:2px solid rgba(47,92,82,.22);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 rgba(47,92,82,.13);font-weight:800;font-size:14px;pointer-events:auto}
.money{color:#8b6410}.stats{display:flex;flex-direction:column;gap:6px}
#toast{position:absolute;z-index:7;left:50%;top:76px;transform:translateX(-50%);background:#fff9e9;border:2px solid #7bb49a;border-radius:15px;padding:10px 15px;font-size:14px;font-weight:750;box-shadow:0 4px 0 #6ca48c;max-width:88%;text-align:center;display:none}
#controls{position:absolute;z-index:4;inset:0;pointer-events:none}
#stickBase{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#fff8e8a8;border:3px solid #fff8e8;box-shadow:0 3px 0 #6caa9a66;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#78bfa0;border:3px solid #fff8e8;left:33px;top:33px;box-shadow:0 3px 0 #4e8b75}
.actions{position:absolute;right:14px;bottom:22px;display:grid;grid-template-columns:repeat(2,76px);gap:10px;pointer-events:auto}
.action{border:2px solid #fff8e8;border-radius:22px;background:#fff5d9;color:#315a51;font-weight:900;font-size:13px;min-height:64px;box-shadow:0 5px 0 #76aa91;touch-action:manipulation}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 #76aa91}
.action.main{background:#ffcf6a;color:#64481a}
#hint{position:absolute;bottom:158px;left:50%;transform:translateX(-50%);background:#fff9e9dc;padding:7px 11px;border-radius:12px;font-size:12px;font-weight:750;white-space:nowrap;pointer-events:none}
.panelWrap{position:absolute;z-index:10;inset:0;background:#23463c66;display:none;align-items:center;justify-content:center;padding:16px}
.panel{width:min(440px,100%);max-height:86vh;overflow:auto;background:#fff9e9;border:3px solid #6da88d;border-radius:24px;padding:18px;box-shadow:0 8px 0 #3e806a}
.panel h2{margin:0 0 8px;font-size:22px}.panel p{margin:6px 0 12px;font-size:14px;line-height:1.45}
.close{float:right;border:0;background:#e7f3df;border-radius:12px;padding:7px 11px;font-weight:900;color:#315a51}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{background:#fffef8;border:2px solid #d9e8d6;border-radius:15px;padding:11px;text-align:left;font-weight:750;color:#294b43}
.item small{display:block;font-weight:550;color:#60756a;margin-top:4px}
.item:disabled{opacity:.45}
.wide{width:100%;padding:12px;border:0;border-radius:14px;background:#76bb91;color:#143f35;font-weight:900;margin-top:10px;font-size:15px}
.wide.gold{background:#ffcf6a;color:#664916}
#timing{display:none;position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,85vw);background:#fff9e9;border:3px solid #6da88d;border-radius:20px;padding:15px;text-align:center;box-shadow:0 7px 0 #3e806a}
#timing h3{margin:0 0 5px}#timing p{font-size:13px;margin:0 0 12px}
.bar{height:28px;background:#e5e8d4;border-radius:14px;overflow:hidden;position:relative;border:2px solid #a5c8a9}
#sweet{position:absolute;left:38%;width:24%;top:0;bottom:0;background:#88d8a0;border-left:2px solid #44875c;border-right:2px solid #44875c}
#marker{position:absolute;left:0;top:-2px;bottom:-2px;width:8px;background:#f3a84f;border:2px solid #fff;border-radius:5px}
#timing button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:13px;background:#ffcf6a;font-size:16px;font-weight:900;color:#634713}
#bottomNote{position:absolute;z-index:3;left:10px;bottom:10px;font-size:10px;color:#214e47;background:#ffffffa8;padding:4px 7px;border-radius:8px}
@media(min-width:760px){.actions{right:28px;bottom:28px;grid-template-columns:repeat(2,90px)}.action{min-height:72px;font-size:14px}#stickBase{left:28px;bottom:28px;width:136px;height:136px}#stick{left:39px;top:39px}.hud{left:20px;right:20px;top:18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="stats">
    <div class="pill">🎣 포근한 낚시생활</div>
    <div class="pill" id="level">⭐ 낚시 Lv. 1</div>
  </div>
  <div class="stats" style="align-items:flex-end">
    <div class="pill money" id="money">🪙 120 G</div>
    <div class="pill" id="bag">🐟 가방 0마리</div>
  </div>
</div>
<div id="toast"></div>
<div id="controls">
  <div id="stickBase"><div id="stick"></div></div>
  <div class="actions">
    <button class="action main" id="fishBtn">🎣 낚시하기</button>
    <button class="action" id="bagBtn">🎒 가방</button>
    <button class="action" id="shopBtn">🏪 상점</button>
    <button class="action" id="homeBtn">🏡 내 땅</button>
  </div>
  <div id="hint">조이스틱으로 이동 · 물가 근처에서 낚시하기</div>
</div>
<div id="timing">
  <h3 id="timingTitle">입질이다!</h3><p id="timingText">초록 구간에 표시가 왔을 때 낚아채기!</p>
  <div class="bar"><div id="sweet"></div><div id="marker"></div></div>
  <button id="reelBtn">지금 낚아채기!</button>
</div>
<div class="panelWrap" id="panelWrap"><div class="panel" id="panel"></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const fishTypes=[
{name:'피라미',emoji:'🐟',price:12,rarity:'일반',color:'#9acbd2'},
{name:'붕어',emoji:'🐠',price:20,rarity:'일반',color:'#e8a76e'},
{name:'무지개송어',emoji:'🐟',price:38,rarity:'고급',color:'#e88d9b'},
{name:'황금잉어',emoji:'🐠',price:90,rarity:'희귀',color:'#ffd34f'},
{name:'달빛메기',emoji:'🐡',price:145,rarity:'영웅',color:'#b9a5ee'},
{name:'별빛금붕어',emoji:'✨🐠',price:260,rarity:'전설',color:'#ffdf86'}
];
let player={x:-110,y:-70,dir:0},money=120,level=1,xp=0,bag=[],rod=0,land=false,house=false,decor=[],fishing=false,gamePaused=false;
let owned=new Set(),time=0,toastTimer;
const camera={x:0,y:0};
const toast=document.getElementById('toast');
function say(s){toast.textContent=s;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2400)}
function updateHud(){document.getElementById('money').textContent='🪙 '+money+' G';document.getElementById('bag').textContent='🐟 가방 '+bag.length+'마리';document.getElementById('level').textContent='⭐ 낚시 Lv. '+level}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function iso(x,y,z=0){return {x:(x-y)*0.78,y:(x+y)*0.39-z}}
function screenPoint(x,y,z=0){let p=iso(x-camera.x,y-camera.y,z);return {x:W*.5+p.x,y:H*.49+p.y}}
function polygon(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function diamond(x,y,w,h,fill,stroke){polygon([{x:x,y:y-h/2},{x:x+w/2,y:y},{x:x,y:y+h/2},{x:x-w/2,y:y}],fill,stroke,1)}
function rect(x,y,w,h,fill,r=0){ctx.fillStyle=fill;if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}else ctx.fillRect(x,y,w,h)}
function drawTree(x,y,s=1){let p=screenPoint(x,y);ctx.fillStyle='#6d9c70';ctx.beginPath();ctx.ellipse(p.x,p.y+7*s,11*s,5*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a87551';ctx.fillRect(p.x-3*s,p.y-18*s,6*s,25*s);for(let i=0;i<3;i++){ctx.fillStyle=['#66b985','#79c995','#55a978'][i];ctx.beginPath();ctx.arc(p.x+(i-1)*7*s,p.y-23*s-i%2*6*s,13*s,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4d9a70';ctx.lineWidth=1;ctx.stroke()}}
function drawHouse(x,y,s=1,ownedHouse=false){let p=screenPoint(x,y);let w=48*s,h=31*s;
polygon([{x:p.x-w/2,y:p.y-h/2},{x:p.x,y:p.y-h/2-17*s},{x:p.x+w/2,y:p.y-h/2}],ownedHouse?'#f2b16f':'#dc9a79','#9a6b55');
polygon([{x:p.x-w/2,y:p.y-h/2},{x:p.x,y:p.y-h/2+13*s},{x:p.x,y:p.y+h/2}],ownedHouse?'#fff0c9':'#e7c79d','#b98a60');
polygon([{x:p.x,y:p.y-h/2+13*s},{x:p.x+w/2,y:p.y-h/2},{x:p.x+w/2,y:p.y+h/2-7*s},{x:p.x,y:p.y+h/2}],ownedHouse?'#f9d8a2':'#d6b07d','#b98a60');
rect(p.x-4*s,p.y+1*s,8*s,15*s,'#9d7056',2);rect(p.x+10*s,p.y-6*s,8*s,7*s,'#9bd8e2',2)}
function drawWorld(){
 ctx.clearRect(0,0,W,H);
 let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b7e7e5');sky.addColorStop(1,'#e5f3d4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant soft clouds
 for(let i=0;i<5;i++){let x=((i*173+time*4)%(W+160))-80,y=90+(i%3)*40;ctx.fillStyle='#fff8e6a8';ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.arc(x+20,y-7,23,0,Math.PI*2);ctx.arc(x+42,y,16,0,Math.PI*2);ctx.fill()}
 // world ground grid
 for(let x=-520;x<=520;x+=40)for(let y=-420;y<=420;y+=40){let p=screenPoint(x,y);diamond(p.x,p.y,63,32,((Math.floor(x/40)+Math.floor(y/40))%2===0)?'#a9d99b':'#a0d28f')}
 // pond left/top of world
 let waterPts=[[-255,-190],[-70,-300],[80,-210],[15,-70],[-170,10],[-300,-70]].map(([x,y])=>screenPoint(x,y));
 polygon(waterPts,'#74cbd8','#55aebd',3);
 // water glints
 for(let i=0;i<18;i++){let x=-260+(i*37)%280,y=-250+(i*61)%210,p=screenPoint(x,y);ctx.strokeStyle='#d6f6ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x-5,p.y);ctx.lineTo(p.x+5,p.y-2);ctx.stroke()}
 // paths
 let path=[[-20,150],[10,90],[60,35],[125,-5],[210,-20]].map(([x,y])=>screenPoint(x,y));
 ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#d9bd86';ctx.lineWidth=26;ctx.lineCap='round';ctx.stroke();ctx.strokeStyle='#eed8a5';ctx.lineWidth=19;ctx.stroke();
 // dock
 let dock=[[-170,-25],[-95,-58],[-72,-18],[-147,20]].map(([x,y])=>screenPoint(x,y));polygon(dock,'#b9885b','#936b4a',2);
 for(let i=0;i<4;i++){let a=screenPoint(-155+i*19,-20+i*8),b=screenPoint(-148+i*19,-38+i*8);ctx.strokeStyle='#e3b57c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 // landmarks
 drawHouse(180,-40,1.12,false);
 // market
 let m=screenPoint(112,36);polygon([{x:m.x-24,y:m.y-10},{x:m.x,y:m.y-24},{x:m.x+24,y:m.y-10}], '#f5c86f','#a8794d',1);rect(m.x-20,m.y-10,40,25,'#fff0c9',2);rect(m.x-5,m.y,10,15,'#b47e5a',2);rect(m.x-14,m.y-4,7,6,'#8bcbd2',1);
 // trees and flowers
 [[-360,-130,1.2],[-330,20,1],[-250,100,.9],[-110,180,1.1],[45,180,.8],[255,80,1.1],[280,-130,1.3],[110,-300,.8],[-20,-350,1]].forEach(a=>drawTree(...a));
 for(let i=0;i<24;i++){let x=-340+(i*71)%620,y=-250+(i*43)%440,p=screenPoint(x,y);ctx.fillStyle=['#ffcfda','#fff0a8','#fff8e6'][i%3];ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,Math.PI*2);ctx.fill()}
 // land plot and home placement
 if(land){let p=screenPoint(220,155);diamond(p.x,p.y,112,58,'#c5e8a3','#4f9c6d');ctx.fillStyle='#4c9868';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('내 땅',p.x,p.y+3);if(house)drawHouse(220,155,1.05,true);decor.forEach((d,i)=>{let q=screenPoint(195+(i%3)*22,145+Math.floor(i/3)*20);if(d==='🌷'){ctx.fillStyle='#e57da2';ctx.beginPath();ctx.arc(q.x,q.y-5,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3d8e61';ctx.beginPath();ctx.moveTo(q.x,q.y-4);ctx.lineTo(q.x,q.y+5);ctx.stroke()}else if(d==='🪑'){rect(q.x-7,q.y-7,14,10,'#b98257',2)}else{ctx.font='17px serif';ctx.fillText(d,q.x,q.y)}})}
 // fishing sign
 let sign=screenPoint(-120,-65);rect(sign.x-2,sign.y-19,4,26,'#9a704d');rect(sign.x-23,sign.y-28,46,17,'#fff1c7',4);ctx.fillStyle='#397d72';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('낚시터',sign.x,sign.y-17);
 // player
 drawPlayer();
}
function drawPlayer(){let p=screenPoint(player.x,player.y);ctx.fillStyle='#4e8b76';ctx.beginPath();ctx.ellipse(p.x,p.y+7,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8b48a';ctx.beginPath();ctx.arc(p.x,p.y-12,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b7891';ctx.beginPath();ctx.ellipse(p.x,p.y+1,10,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0c9';ctx.beginPath();ctx.arc(p.x,p.y-17,9,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(p.x-9,p.y-17,18,3);ctx.fillStyle='#4a4439';ctx.beginPath();ctx.arc(p.x+3,p.y-12,1.2,0,Math.PI*2);ctx.fill();if(fishing){ctx.strokeStyle='#936b4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+7,p.y-4);ctx.lineTo(p.x+31,p.y-30);ctx.lineTo(p.x+45,p.y-8);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x+45,p.y-8);ctx.lineTo(p.x+45,p.y+6);ctx.stroke()}}
let keys={};let joy={x:0,y:0,active:false};const base=document.getElementById('stickBase'),stick=document.getElementById('stick');
function joyMove(e){let r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.left=(r.width/2-24+dx)+'px';stick.style.top=(r.height/2-24+dy)+'px';joy.x=dx/max;joy.y=dy/max}
base.addEventListener('pointerdown',e=>{joy.active=true;base.setPointerCapture(e.pointerId);joyMove(e)});base.addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});function joyEnd(){joy.active=false;joy.x=joy.y=0;stick.style.left=(base.clientWidth/2-24)+'px';stick.style.top=(base.clientHeight/2-24)+'px'}base.addEventListener('pointerup',joyEnd);base.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')startFishing()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function near(x,y,dist){return Math.hypot(player.x-x,player.y-y)<dist}
function loop(){time+=.016;if(!gamePaused){let vx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let l=Math.hypot(vx,vy);if(l>1){vx/=l;vy/=l}player.x=clamp(player.x+vx*2.1,-420,420);player.y=clamp(player.y+vy*2.1,-360,360);camera.x=player.x;camera.y=player.y;drawWorld()}requestAnimationFrame(loop)}loop();
function openPanel(title,body){gamePaused=true;document.getElementById('panel').innerHTML='<button class="close" id="closePanel">닫기 ✕</button><h2>'+title+'</h2>'+body;document.getElementById('panelWrap').style.display='flex';document.getElementById('closePanel').onclick=closePanel}
function closePanel(){document.getElementById('panelWrap').style.display='none';gamePaused=false}
document.getElementById('panelWrap').addEventListener('pointerdown',e=>{if(e.target.id==='panelWrap')closePanel()});
function startFishing(){
 if(fishing||gamePaused)return;
 // fishable water edge: pond center area in world coords
 if(!(player.x>-315&&player.x<-45&&player.y>-300&&player.y<-35)){say('물가나 나무 부두 가까이 가서 낚시해 봐!');return}
 fishing=true;gamePaused=true;document.getElementById('timing').style.display='block';document.getElementById('timingTitle').textContent='입질이다! 🫧';document.getElementById('timingText').textContent='움직이는 표시가 초록 구간에 있을 때 눌러!';markerPos=0;markerDir=1;timingStart=performance.now();
}
let markerPos=0,markerDir=1,timingStart=0;const marker=document.getElementById('marker');
function timingLoop(){if(fishing){markerPos+=markerDir*1.7;if(markerPos>96){markerPos=96;markerDir=-1}if(markerPos<0){markerPos=0;markerDir=1}marker.style.left=markerPos+'%';requestAnimationFrame(timingLoop)}} 
document.getElementById('reelBtn').onclick=()=>{if(!fishing)return;let good=markerPos>=38&&markerPos<=62;fishing=false;gamePaused=false;document.getElementById('timing').style.display='none';if(good){let chance=Math.random(),idx=chance<.52?0:chance<.78?1:chance<.92?2:chance<.975?3:chance<.995?4:5;if((rod>=1&&Math.random()<.16)||(baitBonus&&Math.random()<.35))idx=Math.min(5,idx+1);baitBonus=false;let f={...fishTypes[idx],id:Math.random().toString(36).slice(2),weight:Math.round(rnd(.4,3.2)*10)/10};bag.push(f);xp+=10+idx*5;if(xp>=level*40){xp=0;level++;say('레벨 업! 낚시 Lv. '+level+' 🎉')}else say(f.emoji+' '+f.name+' '+f.weight+'kg 획득! 예상 판매가 '+Math.round(f.price*f.weight)+'G');updateHud()}else{say('앗, 놓쳤어! 초록 구간을 노려 봐.');} };
document.getElementById('fishBtn').onclick=()=>{if(!fishing){startFishing()}else document.getElementById('reelBtn').click()};
const oldRAF=requestAnimationFrame; // timing animation runs only while the minigame is open
document.getElementById('reelBtn').addEventListener('pointerdown',()=>{});
setInterval(()=>{if(fishing){markerPos+=markerDir*1.2;if(markerPos>96){markerPos=96;markerDir=-1}if(markerPos<0){markerPos=0;markerDir=1}marker.style.left=markerPos+'%'}},16);
document.getElementById('bagBtn').onclick=()=>{let body='<p>잡은 물고기: <b>'+bag.length+'마리</b></p>';if(!bag.length)body+='<p>아직 가방이 비어 있어. 물가에서 낚시해 보자!</p>';else{body+='<div class="items">'+bag.map((f,i)=>'<div class="item">'+f.emoji+' '+f.name+'<small>'+f.rarity+' · '+f.weight+'kg</small><small>예상가 '+Math.round(f.price*f.weight)+' G</small></div>').join('')+'</div>';body+='<button class="wide gold" id="sellAll">🐟 전부 상인에게 팔기</button>'}openPanel('🎒 물고기 가방',body);let b=document.getElementById('sellAll');if(b)b.onclick=()=>{let earned=bag.reduce((s,f)=>s+Math.round(f.price*f.weight),0);money+=earned;let n=bag.length;bag=[];updateHud();closePanel();say(n+'마리 판매! '+earned+'G를 벌었어.');};};
document.getElementById('shopBtn').onclick=()=>{let body='<p>낚시로 번 돈으로 장비를 업그레이드하고 땅을 마련해 봐.</p><div class="items"><button class="item" id="rodBuy" '+(rod>=1?'disabled':'')+'>✨ 반짝 낚싯대<small>가격 180G · 희귀 물고기 확률 증가</small></button><button class="item" id="baitBuy" '+(money<45?'':'')+'>🪱 고급 미끼<small>45G · 즉시 1회 낚시 보너스(데모)</small></button><button class="item" id="landBuy" '+(land?'disabled':'')+'>🌱 강가의 작은 땅<small>가격 300G · 내 집터 해금</small></button><button class="item" id="houseBuy" '+(!land||house?'disabled':'')+'>🏡 아늑한 집<small>가격 450G · 내 땅에 집 건설</small></button></div><p style="font-size:12px">현재 장비: '+(rod?'반짝 낚싯대':'기본 낚싯대')+'</p>';openPanel('🏪 마을 상점',body);
document.getElementById('rodBuy').onclick=()=>{if(rod){say('이미 구매했어!');return}if(money<180){say('돈이 부족해. 물고기를 더 팔아 봐!');return}money-=180;rod=1;updateHud();closePanel();say('반짝 낚싯대 장착!');};
document.getElementById('baitBuy').onclick=()=>{if(money<45){say('돈이 부족해!');return}money-=45;updateHud();closePanel();say('고급 미끼 사용! 다음 낚시에서 좋은 물고기 확률이 올라가.');baitBonus=true;};
document.getElementById('landBuy').onclick=()=>{if(land)return;if(money<300){say('땅을 사려면 300G가 필요해!');return}money-=300;land=true;updateHud();closePanel();say('축하해! 강가에 내 땅이 생겼어 🌱');};
document.getElementById('houseBuy').onclick=()=>{if(!land){say('먼저 땅부터 사야 해!');return}if(house)return;if(money<450){say('집을 사려면 450G가 필요해!');return}money-=450;house=true;updateHud();closePanel();say('내 땅에 아늑한 집을 지었어 🏡');};};
let baitBonus=false;
document.getElementById('homeBtn').onclick=()=>{if(!land){openPanel('🏡 나만의 집터','<p>강가의 작은 땅을 <b>300G</b>에 구매하면 이곳에 나만의 집을 꾸밀 수 있어.</p><button class="wide gold" id="goShop">상점에서 땅 구매하기</button>');document.getElementById('goShop').onclick=()=>{closePanel();document.getElementById('shopBtn').click()};return}
let body='<p>내 땅에 오신 걸 환영해! '+(house?'집이 생겼어. 이제 소품으로 꾸며 보자.':'아직 집이 없어. 상점에서 450G로 집을 지을 수 있어.')+'</p><div class="items"><button class="item" id="flower">🌷 꽃밭<small>35G · 작은 꽃 장식</small></button><button class="item" id="chair">🪑 나무 의자<small>50G · 쉬어가기 좋은 의자</small></button><button class="item" id="lamp">🏮 정원 등불<small>65G · 포근한 조명</small></button><button class="item" id="fence">🪵 울타리 장식<small>40G · 아늑한 마당</small></button></div><p>꾸민 소품: '+(decor.length?decor.join(' '):'아직 없어')+'</p>';openPanel('🌿 나만의 땅',body);
[['flower','🌷',35],['chair','🪑',50],['lamp','🏮',65],['fence','🪵',40]].forEach(([id,emoji,cost])=>document.getElementById(id).onclick=()=>{if(money<cost){say('돈이 부족해!');return}money-=cost;decor.push(emoji);updateHud();closePanel();say(emoji+' 장식을 설치했어!');});};
updateHud();
})();
</script>
</body></html>
